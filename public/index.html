<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF TOOLKIT – Simple PDF tools for personal use</title>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body class="bg-slate-50 text-slate-900 antialiased" data-tool="home">
  <div id="site-header"></div>
  <main>
    <section class="bg-white px-4 py-16 text-center sm:py-24">
      <h1 class="mx-auto max-w-3xl text-4xl font-extrabold tracking-tight sm:text-6xl">Your Simple PDF Toolkit</h1>
      <p class="mx-auto mt-5 max-w-xl text-lg text-slate-600">Merge, convert and organize your PDF files quickly and easily.</p>
      <a href="#tools" class="mt-8 inline-block rounded-xl bg-brand-700 px-6 py-3 font-semibold text-white shadow transition hover:bg-brand-800">Choose a tool</a>
    </section>
    <section id="tools" class="mx-auto max-w-6xl scroll-mt-16 px-4 py-16" aria-labelledby="tools-h">
      <h2 id="tools-h" class="mb-8 text-2xl font-bold">Tools</h2>
      <div id="cards" class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3"></div>
    </section>
    <section id="about" class="mx-auto max-w-3xl scroll-mt-16 px-4 pb-20" aria-labelledby="about-h">
      <h2 id="about-h" class="text-2xl font-bold">About</h2>
      <p class="mt-3 text-slate-600">PDF TOOLKIT is a self-hosted tool for everyday PDF jobs. Files are processed on your own server and deleted right after the result is sent.</p>
    </section>
  </main>
  <script src="/js/app.js"></script>
</body>
</html>
